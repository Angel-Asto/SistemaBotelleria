<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Crear cuenta | Sistema de Inventario y Ventas</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body class="acceso-body">
  <main class="container">
    <div class="row justify-content-center align-items-center min-vh-100">
      <div class="col-11 col-sm-8 col-md-6 col-lg-4">
        <div class="card acceso-card shadow">
          <div class="card-body p-4">
            <h1 class="h4 text-center mb-1">Crear cuenta</h1>
            <p class="text-center text-muted mb-4">Sistema de Inventario y Ventas</p>

            <form>
              <div class="mb-3">
                <label for="nombre" class="form-label">Nombre completo</label>
                <input type="text" id="nombre" class="form-control" placeholder="Nombre y apellido" required>
              </div>
              <div class="mb-3">
                <label for="correo" class="form-label">Correo electrónico</label>
                <input type="email" id="correo" class="form-control" placeholder="correo@ejemplo.com" required>
              </div>
              <div class="mb-3">
                <label for="tipoCuenta" class="form-label">Tipo de cuenta</label>
                <select id="tipoCuenta" class="form-select">
                  <option value="trabajador">Trabajador</option>
                  <option value="admin">Admin</option>
                </select>
              </div>
              <div class="mb-3">
                <label for="contrasena" class="form-label">Contraseña</label>
                <input type="password" id="contrasena" class="form-control" placeholder="Crea una contraseña" required>
              </div>
              <div class="mb-3">
                <label for="confirmar" class="form-label">Confirmar contraseña</label>
                <input type="password" id="confirmar" class="form-control" placeholder="Repite la contraseña" required>
              </div>
              <button type="submit" class="btn btn-acceso w-100">Crear cuenta</button>
            </form>

            <p class="text-center mt-3 mb-0">
              ¿Ya tienes cuenta? <a href="sesion.html">Iniciar sesión</a>
            </p>
          </div>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
